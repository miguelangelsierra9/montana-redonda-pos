# ==============================================================================
# MONTAÑA REDONDA PARADISE - CONFIGURACIÓN 1-CLIC PARA RENDER.COM (PLAN GRATIS)
# ==============================================================================
databases:
  - name: montana-redonda-db
    databaseName: montana_redonda_db
    user: mrp_admin
    plan: free

services:
  - type: web
    name: montana-redonda-backend
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --prod=false --filter @mrp/backend...
    startCommand: pnpm --filter @mrp/backend run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: BACKEND_PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: montana-redonda-db
          property: connectionString
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: montana-redonda-db
          property: connectionString
